name: Build and send APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        type: string
      chat_id:
        description: Telegram private chat ID to receive the APK
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_NAME: ${{ inputs.app_name }}
      CHAT_ID: ${{ inputs.chat_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        run: python3 build_android.py

      - name: Build debug-signed APK
        run: gradle --no-daemon assembleDebug

      - name: Send APK to Telegram
        env:
          APP_NAME: ${{ inputs.app_name }}
          CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK};filename=app.apk" \
            --form-string "caption=APK is ready: ${APP_NAME}. Debug-signed for testing, not official release."
