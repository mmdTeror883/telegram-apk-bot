name: Build and send customizable APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Display name of the app
        required: true
        type: string
      chat_id:
        description: Telegram private chat ID that receives the APK
        required: true
        type: string
      template:
        description: App template
        required: true
        type: string
      theme:
        description: UI color theme
        required: true
        type: string
      tagline:
        description: Optional subtitle
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_NAME: ${{ inputs.app_name }}
      CHAT_ID: ${{ inputs.chat_id }}
      APP_TEMPLATE: ${{ inputs.template }}
      APP_THEME: ${{ inputs.theme }}
      APP_TAGLINE: ${{ inputs.tagline }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Use the SDK already installed on ubuntu-24.04. Do not request the obsolete "tools" package.
      - name: Configure Android SDK and install packages with fallback
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "Android SDK command-line tools not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "Using sdkmanager at $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          PACKAGES=("platforms;android-35" "build-tools;35.0.0" "platform-tools")
          if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" "${PACKAGES[@]}"; then
            echo "Batch install failed; retrying SDK packages one at a time."
            for package in "${PACKAGES[@]}"; do
              if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$package"; then
                sleep 5
                "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$package"
              fi
            done
          fi

      - name: Install Gradle 8.9 with mirror fallback
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/gradle-8.9-bin.zip
          if ! curl -fL --retry 3 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$ZIP"; then
            rm -f "$ZIP"
            curl -fL --retry 3 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o "$ZIP"
          fi
          if ! unzip -tq "$ZIP" >/dev/null; then
            rm -f "$ZIP"
            curl -fL --retry 3 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o "$ZIP"
            unzip -tq "$ZIP" >/dev/null
          fi
          unzip -q "$ZIP" -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate selected app template
        run: python3 build_android.py

      - name: Build debug-signed APK
        run: gradle --no-daemon assembleDebug

      # Backup: the APK remains downloadable from GitHub if Telegram is temporarily unavailable.
      - name: Save APK as GitHub artifact
        uses: actions/upload-artifact@v6
        with:
          name: generated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Send APK to Telegram
        id: telegram
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "Repository secret TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RESPONSE="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK};filename=app.apk" \
            --form-string "caption=APK ready: ${APP_NAME}. Debug-signed for testing only.")"
          printf '%s' "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); print("Telegram response:", r.get("description", "OK")); sys.exit(0 if r.get("ok") else 1)'

      - name: Show download fallback if Telegram delivery failed
        if: steps.telegram.outcome == 'failure'
        run: |
          echo "Telegram delivery failed. Download the APK from this run: Artifacts > generated-apk." >> "$GITHUB_STEP_SUMMARY"
