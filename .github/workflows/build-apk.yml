name: Build and send APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        type: string
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      features:
        description: Comma-separated features
        required: false
        default: ""
        type: string
      template:
        description: Template key
        required: false
        default: "telegram"
        type: string
      icon_url:
        description: Icon URL (optional)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      APP_NAME: ${{ inputs.app_name }}
      CHAT_ID: ${{ inputs.chat_id }}
      FEATURES: ${{ inputs.features }}
      TEMPLATE: ${{ inputs.template }}
      ICON_URL: ${{ inputs.icon_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Generate Android project
        run: python3 build_android.py

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: generated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Send to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          curl -F "chat_id=${CHAT_ID}" \
               -F "document=@${APK};filename=app.apk" \
               --form-string "caption=✅ APK آماده: ${APP_NAME}" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
